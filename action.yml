name: 'Pemystack Greenlight'
description: 'AI-powered test selection, execution, and failure diagnosis for every PR.'
author: 'Pemystack'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  anthropic_api_key:
    description: 'Anthropic API key (provide one of anthropic, openai, or gemini)'
    required: false
  openai_api_key:
    description: 'OpenAI API key'
    required: false
  gemini_api_key:
    description: 'Google Gemini API key'
    required: false
  github_token:
    description: 'GitHub token for posting PR comments and fetching diffs'
    required: true
  force_suite:
    description: 'Override suite type (smoke, targeted, full)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Validate AI key
      shell: bash
      run: |
        if [[ -z "${{ inputs.anthropic_api_key }}" && -z "${{ inputs.openai_api_key }}" && -z "${{ inputs.gemini_api_key }}" ]]; then
          echo "::error::No AI API key provided. Set one of anthropic_api_key, openai_api_key, or gemini_api_key."
          exit 1
        fi

    - name: Detect framework
      id: detect
      shell: bash
      run: |
        if [ -f "playwright.config.ts" ] || [ -f "playwright.config.js" ]; then
          echo "framework=playwright" >> "$GITHUB_OUTPUT"
          echo "test_pattern=*.spec.*" >> "$GITHUB_OUTPUT"
          echo "test_path=tests" >> "$GITHUB_OUTPUT"
          echo "results=test-results/junit.xml" >> "$GITHUB_OUTPUT"
        elif [ -f "vitest.config.ts" ] || [ -f "vitest.config.js" ]; then
          echo "framework=vitest" >> "$GITHUB_OUTPUT"
          echo "test_pattern=*.test.*" >> "$GITHUB_OUTPUT"
          echo "test_path=src" >> "$GITHUB_OUTPUT"
          echo "results=junit.xml" >> "$GITHUB_OUTPUT"
        elif [ -f "package.json" ] && grep -q jest package.json 2>/dev/null; then
          echo "framework=jest" >> "$GITHUB_OUTPUT"
          echo "test_pattern=*.test.*" >> "$GITHUB_OUTPUT"
          echo "test_path=src" >> "$GITHUB_OUTPUT"
          echo "results=junit.xml" >> "$GITHUB_OUTPUT"
        elif [ -f "pyproject.toml" ] || [ -f "pytest.ini" ]; then
          echo "framework=pytest" >> "$GITHUB_OUTPUT"
          echo "test_pattern=test_*" >> "$GITHUB_OUTPUT"
          echo "test_path=tests" >> "$GITHUB_OUTPUT"
          echo "results=junit.xml" >> "$GITHUB_OUTPUT"
        elif [ -f "go.mod" ]; then
          echo "framework=go" >> "$GITHUB_OUTPUT"
          echo "test_pattern=*_test.go" >> "$GITHUB_OUTPUT"
          echo "test_path=." >> "$GITHUB_OUTPUT"
          echo "results=junit.xml" >> "$GITHUB_OUTPUT"
        else
          echo "framework=unknown" >> "$GITHUB_OUTPUT"
          echo "test_pattern=*.test.*" >> "$GITHUB_OUTPUT"
          echo "test_path=tests" >> "$GITHUB_OUTPUT"
          echo "results=junit.xml" >> "$GITHUB_OUTPUT"
        fi

    - name: Scan test inventory
      id: inventory
      shell: bash
      run: |
        TEST_PATH="${{ steps.detect.outputs.test_path }}"
        PATTERN="${{ steps.detect.outputs.test_pattern }}"
        TESTS=""
        if [ -d "$TEST_PATH" ]; then
          TESTS=$(find "$TEST_PATH" -name "$PATTERN" 2>/dev/null | sed 's|.*/||' | sed 's|\.spec\..*||; s|\.test\..*||; s|\.[^.]*$||' | sort -u | tr '\n' ',' | sed 's|,$||')
        fi
        echo "tests=$TESTS" >> "$GITHUB_OUTPUT"

    - name: Fetch PR diff
      shell: bash
      run: gh pr diff "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" > /tmp/greenlight-pr.diff
      env:
        GH_TOKEN: ${{ inputs.github_token }}

    - name: Analyze PR
      id: analyze
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        API_URL: https://api.pemystack.com
      run: |
        IFS=',' read -ra INV <<< "${{ steps.inventory.outputs.tests }}"
        INV_JSON=$(printf '%s\n' "${INV[@]}" | jq -R . | jq -s .)

        BODY=$(jq -n \
          --arg diff "$(head -c 60000 /tmp/greenlight-pr.diff)" \
          --argjson inventory "$INV_JSON" \
          --arg framework "${{ steps.detect.outputs.framework }}" \
          --arg repo "${{ github.repository }}" \
          --argjson pr_number ${{ github.event.pull_request.number }} \
          --argjson is_private ${{ github.event.repository.private }} \
          --arg ak "${{ inputs.anthropic_api_key }}" \
          --arg ok "${{ inputs.openai_api_key }}" \
          --arg gk "${{ inputs.gemini_api_key }}" \
          '{diff:$diff, test_inventory:$inventory, framework:$framework, repo:$repo, pr_number:$pr_number, is_private:$is_private, product:"greenlight", anthropic_api_key:(if $ak!="" then $ak else null end), openai_api_key:(if $ok!="" then $ok else null end), gemini_api_key:(if $gk!="" then $gk else null end)}')

        RESP=$(curl -sf -X POST "$API_URL/api/analyze" \
          -H "Content-Type: application/json" \
          -H "x-api-key: public-action-v1" \
          -d "$BODY" 2>&1) || RESP='{"error":"API unreachable"}'

        echo "$RESP" > /tmp/greenlight-analysis.json

        ERROR=$(echo "$RESP" | jq -r '.error // empty')
        if [ -n "$ERROR" ]; then
          COMMENT=$(echo "$RESP" | jq -r '.comment_body // empty')
          [ -n "$COMMENT" ] && echo "$COMMENT" | gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file -
          echo "::error::Greenlight - $ERROR"
          exit 1
        fi

        echo "suite=$(echo "$RESP" | jq -r '.suite_type')" >> "$GITHUB_OUTPUT"
        echo "skip=$(echo "$RESP" | jq -r '.skip')" >> "$GITHUB_OUTPUT"
        echo "classes=$(echo "$RESP" | jq -r '.test_classes_flat')" >> "$GITHUB_OUTPUT"

        RATIONALE=$(echo "$RESP" | jq -r '.rationale')
        SUITE=$(echo "$RESP" | jq -r '.suite_type')
        UPGRADE=$(echo "$RESP" | jq -r '.upgrade_footer // empty')
        BODY_TEXT="## Greenlight Testing Agent"$'\n\n'
        if [ "$SUITE" = "skip" ]; then
          BODY_TEXT+="No tests needed. $RATIONALE"
        else
          BODY_TEXT+="**Suite:** $SUITE | $RATIONALE"$'\n\n'"Tests running..."
        fi
        [ -n "$UPGRADE" ] && BODY_TEXT+=$'\n\n'"$UPGRADE"
        echo "$BODY_TEXT" | gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file -

    - name: Install deps and run tests
      if: steps.analyze.outputs.skip != 'true'
      id: test
      shell: bash
      continue-on-error: true
      run: |
        FW="${{ steps.detect.outputs.framework }}"
        RESULTS="${{ steps.detect.outputs.results }}"
        CLASSES="${{ steps.analyze.outputs.classes }}"
        mkdir -p "$(dirname "$RESULTS")" 2>/dev/null || true

        case "$FW" in
          playwright)
            npm ci || npm install
            npx playwright install --with-deps chromium
            if [ -n "$CLASSES" ]; then
              npx playwright test $(echo "$CLASSES" | tr ' ' '\n' | sed 's/$/.spec/') --reporter=junit > "$RESULTS" 2>&1 || true
            else
              npx playwright test --reporter=junit > "$RESULTS" 2>&1 || true
            fi
            ;;
          jest)
            npm ci || npm install
            JEST_JUNIT_OUTPUT_DIR=. JEST_JUNIT_OUTPUT_NAME=junit.xml npx jest --reporters=default --reporters=jest-junit --forceExit || true
            ;;
          vitest)
            npm ci || npm install
            npx vitest run --reporter=junit --outputFile="$RESULTS" || true
            ;;
          pytest)
            pip install -r requirements.txt 2>/dev/null || pip install pytest
            python -m pytest --junitxml="$RESULTS" || true
            ;;
          go)
            go install github.com/jstemmer/go-junit-report/v2@latest
            go test -v ./... 2>&1 | go-junit-report > "$RESULTS" || true
            ;;
          *)
            npm ci || npm install
            npm test || true
            ;;
        esac

    - name: Diagnose and report
      if: steps.analyze.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        API_URL: https://api.pemystack.com
      run: |
        RESULTS="${{ steps.detect.outputs.results }}"
        PARSED='{"failures":[],"total":0,"failed":0}'
        if [ -f "$RESULTS" ]; then
          PARSED=$(python3 "${{ github.action_path }}/parse-results.py" "$RESULTS" 2>/dev/null || echo "$PARSED")
        fi

        TOTAL=$(echo "$PARSED" | jq -r '.total')
        FAILED=$(echo "$PARSED" | jq -r '.failed')
        FAILURES=$(echo "$PARSED" | jq -c '.failures')

        BODY=$(jq -n \
          --arg diff "$(head -c 40000 /tmp/greenlight-pr.diff)" \
          --argjson failures "$FAILURES" \
          --slurpfile analysis /tmp/greenlight-analysis.json \
          --arg repo "${{ github.repository }}" \
          --argjson pr_number ${{ github.event.pull_request.number }} \
          --arg pr_url "${{ github.event.pull_request.html_url }}" \
          --argjson total "$TOTAL" \
          --argjson failed "$FAILED" \
          --arg ak "${{ inputs.anthropic_api_key }}" \
          --arg ok "${{ inputs.openai_api_key }}" \
          --arg gk "${{ inputs.gemini_api_key }}" \
          '{diff:$diff, failures:$failures, analysis:$analysis[0], repo:$repo, pr_number:$pr_number, pr_url:$pr_url, total_tests:$total, failed_tests:$failed, product:"greenlight", anthropic_api_key:(if $ak!="" then $ak else null end), openai_api_key:(if $ok!="" then $ok else null end), gemini_api_key:(if $gk!="" then $gk else null end)}')

        RESP=$(curl -sf -X POST "$API_URL/api/diagnose" \
          -H "Content-Type: application/json" \
          -H "x-api-key: public-action-v1" \
          -d "$BODY" 2>&1) || RESP='{"overall_assessment":"Diagnosis unavailable."}'

        SUITE=$(jq -r '.suite_type' /tmp/greenlight-analysis.json)
        RATIONALE=$(jq -r '.rationale' /tmp/greenlight-analysis.json)
        UPGRADE=$(jq -r '.upgrade_footer // empty' /tmp/greenlight-analysis.json)
        ASSESSMENT=$(echo "$RESP" | jq -r '.overall_assessment // empty')

        COMMENT="## Greenlight Testing Agent"$'\n\n'
        COMMENT+="**Suite:** $SUITE | $RATIONALE"$'\n\n'

        if [ "$FAILED" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
          COMMENT+="All $TOTAL tests passed."
        elif [ "$FAILED" -gt 0 ]; then
          COMMENT+="$FAILED / $TOTAL tests failed."$'\n\n'
          [ -n "$ASSESSMENT" ] && COMMENT+="**Summary:** $ASSESSMENT"$'\n\n'
          echo "$RESP" | jq -r '.diagnoses[]? | "**\(.test)** — \(if .likely_caused_by_pr then "caused by PR" else "pre-existing" end) (\(.confidence))\n> \(.root_cause)\n"' 2>/dev/null | while IFS= read -r line; do
            COMMENT+="$line"$'\n'
          done
        else
          COMMENT+="No test results found."
        fi

        [ -n "$UPGRADE" ] && COMMENT+=$'\n'"$UPGRADE"
        echo "$COMMENT" | gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file -
