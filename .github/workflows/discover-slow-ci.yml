name: CI Discovery Bot

on:
  schedule:
    # Every Monday at 8am UTC (11am EAT)
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      post:
        description: 'Auto-post outreach (capped at 3/run)'
        type: boolean
        default: true

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Run discovery and outreach
        env:
          # OUTREACH_PAT needs public_repo scope to create issues on other repos.
          # Falls back to GITHUB_TOKEN (discovery only, no posting).
          GITHUB_TOKEN: ${{ secrets.OUTREACH_PAT || secrets.GITHUB_TOKEN }}
          SEEN_FILE: data/discovered-repos.json
          POSTED_FILE: data/posted-repos.json
          OUTPUT_FILE: data/ci-discoveries.json
        run: |
          POST_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.post }}" = "true" ]; then
            POST_FLAG="--post"
          fi
          python scripts/discover-slow-ci.py $POST_FLAG

      - name: Upload discoveries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-discoveries
          path: data/ci-discoveries.json
          retention-days: 30

      - name: Commit tracking files
        run: |
          git config user.name "Ken Isiaho"
          git config user.email "kenisiaho@gmail.com"
          git add data/discovered-repos.json data/posted-repos.json || true
          git diff --staged --quiet || git commit -m "chore: update discovery tracking [skip ci]"
          git push || true
